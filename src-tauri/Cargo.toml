[package]
name = "snap-lingo"
version = "1.0.5"
description = "SnapLingo - 轻量级截图 OCR 翻译工具"
authors = ["SnapLingo"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "snap_lingo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "image-ico"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-opener = "2"
tauri-plugin-autostart = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"

xcap = { version = "0.9", features = ["image", "wgc"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
base64 = "0.22"

# native-tls → schannel on Windows: no OpenSSL, no ring, no C toolchain.
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "native-tls"] }

anyhow = "1"
# `std` pulls in `alloc`, which is what `set_boxed_logger` is gated behind.
log = { version = "0.4", features = ["std"] }
# A tokio runtime is already in the tree (tauri / reqwest); we only need timers
# for the retry backoff, so no runtime features are requested.
tokio = { version = "1", features = ["time"] }

# Request signing for the Chinese cloud engines (Tencent TC3-HMAC-SHA256 needs
# sha2 + hmac; Baidu and Youdao only need a plain hash).
sha2 = "0.10"
hmac = "0.12"
md5 = "0.7"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Media_Ocr",
    "Graphics_Imaging",
    "Globalization",
    "Storage_Streams",
    "Foundation",
    "Foundation_Collections",
    "Win32_System_WinRT",
    "Win32_System_SystemInformation",
] }
windows-future = "0.3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
incremental = false
